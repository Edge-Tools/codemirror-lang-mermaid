name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# You can also run it by hand from the Actions tab (workflow_dispatch).
#
# Authentication uses npm "trusted publishing" (OIDC) — there is no NPM_TOKEN.
# The registry verifies this workflow's identity via the id-token below, so a
# matching trusted publisher must be configured on the package's npm settings
# page (see the repo README / setup notes). Provenance is generated automatically.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; setup-node still ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prepare

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
