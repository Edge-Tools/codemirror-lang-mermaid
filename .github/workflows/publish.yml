name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# You can also run it by hand from the Actions tab (workflow_dispatch).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prepare

      - name: Test
        run: npm test

      # `--provenance` records a signed link from the package back to this
      # commit and workflow run. It requires the repository to be public; if the
      # repo is private, drop the `--provenance` flag.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
